name: "[POSTMAN] Regressie feature"

# Runs one regression collection from the Postman workspace (the source of truth) against Test.
# Trigger: gh workflow run postman-feature.yml -f feature=bankrekeningnummers
# See .opencode/skills/postman-regressie/SKILL.md.
#
# Required repository configuration:
#   vars.POSTMAN_TEST_ENVIRONMENT_UID (the Test environment in the Postman workspace)
#   vars.POSTMAN_TEST_BEHEER_URL, vars.POSTMAN_TEST_PUBLIEK_URL
#   secrets.POSTMAN_API_KEY (its owner must have access to the workspace), secrets.POSTMAN_TEST_TOKEN_URL,
#   secrets.POSTMAN_TEST_CLIENT_ID, secrets.POSTMAN_TEST_CLIENT_SECRET, secrets.POSTMAN_TEST_VR_API_KEY

on:
  workflow_dispatch:
    inputs:
      feature:
        description: "Feature to run"
        required: true
        type: choice
        # one option per entry in COLLECTIONS below
        options:
          - bankrekeningnummers
          - basisgegevens
          - contactgegevens
          - dubbeldetectie
          - dubbelmerge
          - erkenningen
          - geotags
          - hoofdactiviteiten
          - lidmaatschappen
          - locaties
          - projecties
          - stopzetting
          - subverenigingen
          - vertegenwoordigers
          - verwijderen
          - werkingsgebieden
          - zoeken
  workflow_call:
    inputs:
      feature:
        description: "Feature key in COLLECTIONS (e.g. bankrekeningnummers)"
        required: true
        type: string

env:
  # feature -> collection UID in the Postman workspace (Postman: collection > Info > Collection ID)
  # regressie-all.yml runs every key of this map.
  COLLECTIONS: |
    {
      "bankrekeningnummers": "34061079-8fe993fc-bb98-4531-947b-c77c1c1eaaec",
      "basisgegevens": "34061079-42918bc6-61a6-4bcb-aad8-ab1744c1b7ba",
      "contactgegevens": "34061079-00b3a89b-7037-492e-8d75-40e460f5ff84",
      "dubbeldetectie": "34061079-166c64ae-b7df-4168-a33c-ac552e024a7e",
      "dubbelmerge": "34061079-b788cbfd-05d9-4cc6-b573-bb239977f7dd",
      "erkenningen": "34061079-fdb169bf-368a-4597-ab3e-9c8d68dbdd97",
      "geotags": "34061079-d8c4f540-98d4-446d-9c85-1081e5fa38e4",
      "hoofdactiviteiten": "34061079-e497482a-9a5d-4be2-bd08-791aeb7d4eb9",
      "lidmaatschappen": "34061079-72ce5be7-4025-48d1-bc20-8b5e6f238d2e",
      "locaties": "34061079-8b12be31-8aaa-4f98-8aa2-63e4242150bb",
      "projecties": "34061079-d278a0ff-b978-4ff7-8b7f-12a00d69fab8",
      "stopzetting": "34061079-e555749a-b4f1-4634-af73-f7274c7febd9",
      "subverenigingen": "34061079-947b38db-494b-4ee6-afda-c10517429879",
      "vertegenwoordigers": "34061079-797ebc98-32bc-4bf4-b5b0-80b00c8a4590",
      "verwijderen": "34061079-db1748ce-1035-46a0-9a89-c09af5cb3a8f",
      "werkingsgebieden": "34061079-d4719dc6-c377-43e5-b279-4a4b31855a21",
      "zoeken": "34061079-2d24c2d6-9500-45e0-a418-9d3bc88b53f5"
    }

jobs:
  regressie:
    name: Regressie ${{ inputs.feature }}
    runs-on: ubuntu-latest
    steps:
      # Node in the tool cache, so a global npm install needs no root (the runner's /usr/local is root-owned)
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Postman CLI
        run: npm install --global postman-cli@1.87.0

      - name: Login to Postman CLI
        run: postman login --with-api-key "${{ secrets.POSTMAN_API_KEY }}"

      - name: Run collection
        env:
          ENVIRONMENT_UID: ${{ vars.POSTMAN_TEST_ENVIRONMENT_UID }}
          BEHEER_URL: ${{ vars.POSTMAN_TEST_BEHEER_URL }}
          PUBLIEK_URL: ${{ vars.POSTMAN_TEST_PUBLIEK_URL }}
          TOKEN_URL: ${{ secrets.POSTMAN_TEST_TOKEN_URL }}
          CLIENT_ID: ${{ secrets.POSTMAN_TEST_CLIENT_ID }}
          CLIENT_SECRET: ${{ secrets.POSTMAN_TEST_CLIENT_SECRET }}
          VR_API_KEY: ${{ secrets.POSTMAN_TEST_VR_API_KEY }}
          FEATURE: ${{ inputs.feature }}
        run: |
          postman collection run "$(jq -r --arg f "$FEATURE" '.[$f]' <<< "$COLLECTIONS")" \
            -e "${ENVIRONMENT_UID}" \
            --env-var "beheer_url=${BEHEER_URL}" \
            --env-var "publiek_url=${PUBLIEK_URL}" \
            --env-var "token_url=${TOKEN_URL}" \
            --env-var "clientId=${CLIENT_ID}" \
            --env-var "clientSecret=${CLIENT_SECRET}" \
            --env-var "vr-api-key=${VR_API_KEY}" \
            -r cli,junit,html \
            --reporter-junit-export "postman-reports/${FEATURE}.xml" \
            --reporter-html-export "postman-reports/${FEATURE}.html"

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: postman-regressie-${{ inputs.feature }}
          path: postman-reports/
          retention-days: 30
