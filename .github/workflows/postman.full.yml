name: "[POSTMAN] Full Regression Suite"

on:
  workflow_dispatch:
  schedule:
    - cron: '0 2 * * 1'
    - cron: '0 2 * * 3'

jobs:
  automated-api-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Postman CLI
        run: |
          curl -o- "https://dl-cli.pstmn.io/install/linux64.sh" | sh
      - name: Login to Postman CLI
        run: postman login --with-api-key ${{ secrets.POSTMAN_API_KEY }}
      - name: Run API tests
        run: |
          postman collection run "34061079-b9019512-c4b9-4844-9e86-e70fc8d65a4a" -e "24467383-b7b1ecfe-ae6d-4ded-a378-db554a2bc155" \
            -r html,json \
            --reporter-html-export test-report-full.html \
            --reporter-json-export test-results.json

      - name: Build failure-only report
        if: always()
        run: |
          python3 - <<'PYEOF'
          # The "All Requests" tab in Postman's HTML reporter is NOT static HTML —
          # it's rendered client-side from one big `const iterations = [...]` JS blob
          # via IterationManager.createIteration(). There is nothing to strip out of
          # it with BeautifulSoup; doing so only desyncs the tab-button/tab-content
          # pair and breaks "View request" (switchTab(1) throws -> blank page).
          #
          # Instead we flip the report's own built-in request filter so it defaults
          # to "Requests with test failures or errors" instead of "All Requests".
          # The full dataset (and every DOM element "View request" needs) stays
          # intact, but only failing executions get built into the DOM -> fast,
          # and "View request" keeps working because a failed request always
          # survives that filter.
 
          old = (
              "{ text: 'All Requests', type: ExecutionFilterTypes.ALL, defaultSelected: true },\n"
              "        { text: 'Requests with test failures or errors', type: ExecutionFilterTypes.TEST_FAILURES_OR_ERRORS },"
          )
          new = (
              "{ text: 'All Requests', type: ExecutionFilterTypes.ALL },\n"
              "        { text: 'Requests with test failures or errors', type: ExecutionFilterTypes.TEST_FAILURES_OR_ERRORS, defaultSelected: true },"
          )
 
          with open('test-report-full.html', encoding='utf-8') as f:
              html = f.read()
 
          count = html.count(old)
          if count != 1:
              raise SystemExit(
                  f"Expected exactly 1 match for the filter-button snippet, found {count}. "
                  "The Postman HTML reporter template likely changed — update the "
                  "'old'/'new' strings above before this can run unattended."
              )
 
          html = html.replace(old, new)
 
          with open('test-report-only-failure-detail.html', 'w', encoding='utf-8') as f:
              f.write(html)
 
          print("Wrote test-report-only-failure-detail.html "
                f"({len(html) / 1_000_000:.1f} MB, default filter = failures/errors)")
          PYEOF

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: postman-test-reports
          path: |
            test-report-full.html
            test-report-only-failure-detail.html
            test-results.json
            postman-cli-reports/
          retention-days: 30

      - name: Notify Slack
        if: always()
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          JOB_STATUS: ${{ job.status }}
        run: |
          if [ "$JOB_STATUS" = "success" ]; then
            MESSAGE="✅ *API tests succeeded* on \`${{ github.workflow }}\` in repo \`${{ github.repository }}\`.\n<https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}|View logs>"
          else
            MESSAGE="❌ *API tests failed* on \`${{ github.workflow }}\` in repo \`${{ github.repository }}\`.\n<@U03P611N5TK>,<@koenmetsu> please check the logs: <https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}>"
          fi

          curl -X POST -H 'Content-type: application/json' \
          --data "{\"text\":\"$MESSAGE\"}" \
          $SLACK_WEBHOOK_URL
