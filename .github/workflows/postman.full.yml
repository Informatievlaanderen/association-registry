name: "[POSTMAN] Full Regression Suite"

on:
  workflow_dispatch:
  schedule:
    - cron: '0 2 * * 1'
    - cron: '0 2 * * 3'

jobs:
  automated-api-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Postman CLI
        run: |
          curl -o- "https://dl-cli.pstmn.io/install/linux64.sh" | sh
      - name: Login to Postman CLI
        run: postman login --with-api-key ${{ secrets.POSTMAN_API_KEY }}
      - name: Run API tests
        run: |
          postman collection run "34061079-b9019512-c4b9-4844-9e86-e70fc8d65a4a" -e "24467383-b7b1ecfe-ae6d-4ded-a378-db554a2bc155" \
            -r html,json \
            --reporter-html-export test-report-full.html \
            --reporter-json-export test-results.json

      - name: Generate failures-only HTML report
        if: always()
        run: |
          python3 <<'EOF'
          import json
          import re
          import os

          html_file = "test-report-full.html"

          if not os.path.exists(html_file):
           print(f"{html_file} not found")
           exit(0)

          with open(html_file, "r", encoding="utf-8") as f:
           html = f.read()

          # Zoek de iterations dataset
          match = re.search(
           r'const iterations=(\{.*?\})\s*const summary=',
           html,
           flags=re.DOTALL
          )

          if not match:
           print("Could not locate iterations object")
           exit(1)

          iterations = json.loads(match.group(1))

          total_before = 0
          total_after = 0

          for iteration in iterations.values():

           filtered_items = []

           for item in iteration.get("items", []):

               executions = item.get("executions", [])

               failed_executions = []

               for execution in executions:

                   has_errors = len(execution.get("errors", [])) > 0

                   has_failed_tests = any(
                       test.get("status") == "failed"
                       for test in execution.get("tests", [])
                   )

                   if has_errors or has_failed_tests:
                       failed_executions.append(execution)

               total_before += len(executions)
               total_after += len(failed_executions)

               if failed_executions:
                   item["executions"] = failed_executions
                   filtered_items.append(item)

           iteration["items"] = filtered_items

          # Vervang filtered iterations terug in html
          new_iterations_json = json.dumps(
           iterations,
           separators=(",", ":")
          )

          html = (
           html[:match.start(1)]
           + new_iterations_json
           + html[match.end(1):]
          )

          # Hernoem tab "All Requests" naar "Failed Requests"
          html = re.sub(
           r'>(\s*)All Requests(\s*)<',
           r'>Failed Requests<',
           html,
           flags=re.IGNORECASE
          )

          # Hernoem request filter
          html = html.replace(
           'All Requests',
           'Failed Requests'
          )

          with open(
           "test-report-only-failure-detail.html",
           "w",
           encoding="utf-8"
          ) as f:
           f.write(html)

          print(
           f"Failures-only report created. "
           f"Executions reduced from {total_before} to {total_after}"
          )
          EOF

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: postman-test-reports
          path: |
            test-report-full.html
            test-report-only-failure-detail.html
            test-results.json
            postman-cli-reports/
          retention-days: 30

      - name: Notify Slack
        if: always()
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          JOB_STATUS: ${{ job.status }}
        run: |
          if [ "$JOB_STATUS" = "success" ]; then
            MESSAGE="✅ *API tests succeeded* on \`${{ github.workflow }}\` in repo \`${{ github.repository }}\`.\n<https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}|View logs>"
          else
            MESSAGE="❌ *API tests failed* on \`${{ github.workflow }}\` in repo \`${{ github.repository }}\`.\n<@U03P611N5TK>,<@koenmetsu> please check the logs: <https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}>"
          fi

          curl -X POST -H 'Content-type: application/json' \
          --data "{\"text\":\"$MESSAGE\"}" \
          $SLACK_WEBHOOK_URL
