# Sigrid analysis scope configuration
# https://docs.sigrid-says.com/reference/analysis-scope-configuration.html
#
# Technologies and test code are detected automatically.
# Patterns are regular expressions and always start with ".*/".

# Every project directory is a component; integrations are split per project
# instead of being grouped into a single "integrations" component.
component_base_dirs:
  - "src"
  - "src/integrations"
  - "Root files"

exclude:
  # Tooling, local dev and CI support (not part of the application)
  - ".*/[.]build/.*"
  - ".*/[.]specify/.*"
  - ".*/[.]opencode/.*"
  - ".*/[.]localstack/.*"
  - ".*/wiremock/.*"
  - ".*/grafana/.*"
  - ".*/identityserver/.*"
  - ".*/scripts/.*"
  - ".*/tools/.*"
  - ".*[.]csx"
  # Database migration scripts
  - ".*/migrations/.*"
  # Generated code
  - ".*[.]Designer[.]cs"

# Security scan only; the exclude list above does not apply to security.
thirdpartyfindings:
  exclude:
    # detect-secrets baseline: only contains hashes of known findings
    - ".*/[.]secrets[.]baseline"
    # Mock responses for external services (fictitious test data)
    - ".*/wiremock/.*"
    # AI tooling templates and prompts (spec-kit, OpenCode)
    - ".*/[.]specify/.*"
    - ".*/[.]opencode/.*"
